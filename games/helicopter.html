<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Вертоліт — вчимо звук Р</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }
    #root { position: relative; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const TRILL_FREQ_MIN = 22;
const TRILL_FREQ_MAX = 40;
const RMS_NOISE_FLOOR = 0.012;
const MOD_INDEX_MIN = 0.35;     // required envelope modulation depth (trill vs vowel)
const TRILL_CONFIRM_FRAMES = 3; // consecutive positive frames before lift-off
const RISE_SPEED = 0.026;   // faster, easier climb
const FALL_SPEED = 0.0045;  // gentler gravity
const LERP_FACTOR = 0.09;
const TOP_BOUND = 0.14;     // stops just below the top HUD / star counter
const BOTTOM_BOUND = 0.86;

// ─── Collectible stars ───────────────────────────────────────────────────────
const STAR_SPAWN_MS = 2100;     // how often a new star appears
const STAR_SPEED = 0.00016;     // horizontal drift speed (fraction/ms)
const STAR_RADIUS = 0.07;       // generous collection radius (fraction of width)
const STARS_TO_WIN = 5;         // collect this many to win

const STARS_MESSAGES = [
  'Чудово! ⭐',
  'Молодець! 🌟',
  'Супер! ✨',
  'Так тримати! 💫',
];

// ─── Utility ─────────────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// Detect trill via autocorrelation on the time-domain buffer.
// Returns { detected: bool, freq: number }
function detectTrill(buffer, sampleRate) {
  const N = buffer.length;

  // RMS check
  let sum = 0;
  for (let i = 0; i < N; i++) sum += buffer[i] * buffer[i];
  const rms = Math.sqrt(sum / N);
  if (rms < RMS_NOISE_FLOOR) return { detected: false, freq: 0, rms };

  // Amplitude envelope — downsample to ~500 Hz envelope signal
  // by taking absolute value and low-passing with window
  const envRate = 500;
  const hop = Math.round(sampleRate / envRate);
  const env = [];
  for (let i = 0; i < N - hop; i += hop) {
    let s = 0;
    for (let j = 0; j < hop; j++) s += Math.abs(buffer[i + j]);
    env.push(s / hop);
  }

  const M = env.length;
  if (M < 10) return { detected: false, freq: 0, rms, modIndex: 0 };

  // Modulation depth (key discriminator!):
  // A rolled R rapidly chops the sound on/off, so its loudness envelope swings
  // wildly (high std relative to mean). A steady vowel "ааа" or hiss "шшш" has
  // an almost flat envelope (low modulation). This gate rejects non-trill sounds.
  const envMean = env.reduce((a, b) => a + b, 0) / M;
  let envVar = 0;
  for (let i = 0; i < M; i++) {
    const d = env[i] - envMean;
    envVar += d * d;
  }
  envVar /= M;
  const envStd = Math.sqrt(envVar);
  const modIndex = envMean > 0 ? envStd / envMean : 0;

  const envNorm = env.map(v => v - envMean);

  // Autocorrelation on envelope
  const lagMin = Math.floor(envRate / TRILL_FREQ_MAX);
  const lagMax = Math.ceil(envRate / TRILL_FREQ_MIN);

  let bestCorr = -Infinity;
  let bestLag = -1;
  for (let lag = lagMin; lag <= Math.min(lagMax, M - 1); lag++) {
    let c = 0;
    for (let i = 0; i < M - lag; i++) c += envNorm[i] * envNorm[i + lag];
    if (c > bestCorr) { bestCorr = c; bestLag = lag; }
  }

  // Normalise by zero-lag
  let c0 = 0;
  for (let i = 0; i < M; i++) c0 += envNorm[i] * envNorm[i];
  const r = c0 > 0 ? bestCorr / c0 : 0;

  const freq = bestLag > 0 ? envRate / bestLag : 0;

  // A real trill needs ALL of:
  //  • strong periodicity of the envelope (high autocorrelation)
  //  • that period falling in the rolled-R tap-rate band
  //  • deep on/off modulation (rejects steady vowels & continuous noise)
  const detected =
    r > 0.45 &&
    freq >= TRILL_FREQ_MIN && freq <= TRILL_FREQ_MAX &&
    modIndex > MOD_INDEX_MIN;

  return { detected, freq, rms, modIndex };
}

// ─── Cloud data (static, generated once) ─────────────────────────────────────
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({
  id: i,
  x: 0.05 + Math.random() * 0.85,
  y: 0.05 + Math.random() * 0.45,
  scale: 0.6 + Math.random() * 0.9,
  speed: 0.00008 + Math.random() * 0.00012,
}));

// ─── Canvas Renderer ─────────────────────────────────────────────────────────
function drawScene(ctx, W, H, state) {
  const {
    heliY, targetHeliY, trillDetected, rms, trillFreq,
    clouds, sparks, milestone, milestoneAlpha, showTherapist,
    stars, score,
  } = state;

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#87CEEB');
  sky.addColorStop(1, '#E0F4FF');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Ground
  const grassH = H * 0.08;
  ctx.fillStyle = '#6BCB77';
  ctx.fillRect(0, H - grassH, W, grassH);
  // grass detail
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, H - grassH, W, grassH * 0.3);

  // Clouds
  clouds.forEach(c => drawCloud(ctx, c.x * W, c.y * H, c.scale, W));

  // Altitude bar (right side)
  const barX = W - 22;
  const barH = H * 0.7;
  const barY = H * 0.15;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  roundRect(ctx, barX - 6, barY, 16, barH, 8);
  ctx.fill();
  const fillH = barH * (1 - heliY);
  ctx.fillStyle = trillDetected
    ? 'rgba(80,220,120,0.85)' : 'rgba(180,180,180,0.6)';
  roundRect(ctx, barX - 6, barY + barH - fillH, 16, fillH, 8);
  ctx.fill();

  // Collectible stars (behind helicopter)
  stars.forEach(o => drawCollectStar(ctx, o.x * W, o.y * H, W, o.wobble));

  // Helicopter
  const hx = W * 0.42;
  const hy = heliY * H;
  drawHelicopter(ctx, hx, hy, trillDetected, W);

  // Star counter — top center, with little star icons
  ctx.save();
  ctx.font = `bold ${Math.round(W * 0.05)}px "Comic Sans MS", cursive`;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(80,140,200,0.7)';
  ctx.lineWidth = 5;
  const scoreText = `${score} / ${STARS_TO_WIN}`;
  ctx.strokeText(scoreText, W * 0.5, H * 0.075);
  ctx.fillText(scoreText, W * 0.5, H * 0.075);
  ctx.restore();
  // row of star pips under the counter
  for (let i = 0; i < STARS_TO_WIN; i++) {
    const px = W * 0.5 + (i - (STARS_TO_WIN - 1) / 2) * W * 0.06;
    drawStar(ctx, px, H * 0.115, W * 0.018,
      i < score ? '#FFC107' : 'rgba(255,255,255,0.45)');
  }

  // Sparks / sparkles
  sparks.forEach(s => {
    ctx.save();
    ctx.globalAlpha = s.alpha;
    drawStar(ctx, s.x, s.y, s.r, '#FFD700');
    ctx.restore();
  });

  // Milestone message
  if (milestone && milestoneAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = milestoneAlpha;
    const fs = Math.round(W * 0.07);
    ctx.font = `bold ${fs}px "Comic Sans MS", cursive`;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#FF6B35';
    ctx.fillText(milestone, W * 0.48, H * 0.22);
    ctx.restore();
  }

  // Mic level bar (bottom left)
  const micBarW = W * 0.28;
  const micBarH = 20;
  const micX = 18;
  const micY = H - grassH - micBarH - 14;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  roundRect(ctx, micX, micY, micBarW, micBarH, 10);
  ctx.fill();
  const level = clamp(rms / 0.15, 0, 1);
  ctx.fillStyle = level > 0.05
    ? (trillDetected ? '#4CAF50' : '#2196F3')
    : '#aaa';
  roundRect(ctx, micX, micY, micBarW * level, micBarH, 10);
  ctx.fill();
  // mic icon text
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = `${Math.round(micBarH * 0.8)}px sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText('🎤', micX + micBarW + 6, micY + micBarH - 2);

  // Therapist overlay
  if (showTherapist) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, 10, 10, 220, 100, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`RMS:  ${rms.toFixed(4)}`, 20, 32);
    ctx.fillText(`Freq: ${trillFreq.toFixed(1)} Hz`, 20, 52);
    ctx.fillText(`Mod:  ${(state.modIndex || 0).toFixed(2)} (>${MOD_INDEX_MIN})`, 20, 72);
    ctx.fillText(`Trill: ${trillDetected ? '✓ YES' : '✗ NO'}`, 20, 92);
    ctx.restore();
  }
}

function drawCloud(ctx, cx, cy, scale, W) {
  const r = W * 0.055 * scale;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.shadowColor = 'rgba(100,160,200,0.3)';
  ctx.shadowBlur = 10;
  const blobs = [
    [0, 0, r], [-r * 0.8, r * 0.2, r * 0.75],
    [r * 0.8, r * 0.2, r * 0.75], [-r * 0.4, -r * 0.5, r * 0.6],
    [r * 0.4, -r * 0.5, r * 0.6],
  ];
  blobs.forEach(([dx, dy, rad]) => {
    ctx.beginPath();
    ctx.arc(cx + dx, cy + dy, rad, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawHelicopter(ctx, cx, cy, active, W, hit) {
  const s = W * 0.14; // scale unit (a bit bigger)
  const t = Date.now();
  const bob = Math.sin(t / 220) * s * 0.03; // gentle hover bobbing

  ctx.save();
  ctx.translate(cx, cy + bob);

  // Soft drop shadow under the helicopter
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.5, s * 0.42, s * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Tail boom (drawn first, behind body) ──
  const tailGrad = ctx.createLinearGradient(-s * 0.85, 0, -s * 0.3, 0);
  tailGrad.addColorStop(0, '#ff8a4c');
  tailGrad.addColorStop(1, '#ff5e1a');
  ctx.fillStyle = tailGrad;
  ctx.beginPath();
  ctx.moveTo(-s * 0.3, -s * 0.16);
  ctx.quadraticCurveTo(-s * 0.7, -s * 0.18, -s * 0.92, -s * 0.05);
  ctx.lineTo(-s * 0.92, s * 0.06);
  ctx.quadraticCurveTo(-s * 0.7, s * 0.02, -s * 0.3, s * 0.12);
  ctx.closePath();
  ctx.fill();

  // Tail fin
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(-s * 0.86, -s * 0.04);
  ctx.lineTo(-s * 0.98, -s * 0.32);
  ctx.lineTo(-s * 0.8, -s * 0.06);
  ctx.closePath();
  ctx.fill();

  // ── Main body (rounded teardrop) ──
  const bodyGrad = ctx.createLinearGradient(0, -s * 0.35, 0, s * 0.35);
  bodyGrad.addColorStop(0, '#ffd23f');
  bodyGrad.addColorStop(0.45, '#ff8c42');
  bodyGrad.addColorStop(1, '#ff5e1a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(s * 0.5, 0);
  ctx.bezierCurveTo(s * 0.5, -s * 0.34, s * 0.1, -s * 0.4, -s * 0.18, -s * 0.32);
  ctx.bezierCurveTo(-s * 0.42, -s * 0.26, -s * 0.42, s * 0.26, -s * 0.18, s * 0.34);
  ctx.bezierCurveTo(s * 0.1, s * 0.42, s * 0.5, s * 0.34, s * 0.5, 0);
  ctx.closePath();
  ctx.fill();

  // Glossy highlight on body
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-s * 0.05, -s * 0.18, s * 0.22, s * 0.08, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Big friendly cockpit window ──
  const winGrad = ctx.createLinearGradient(s * 0.1, -s * 0.25, s * 0.3, s * 0.2);
  winGrad.addColorStop(0, '#cdf3ff');
  winGrad.addColorStop(1, '#7ec8e3');
  ctx.fillStyle = winGrad;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = s * 0.04;
  ctx.beginPath();
  ctx.ellipse(s * 0.2, -s * 0.02, s * 0.24, s * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // window shine
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(s * 0.13, -s * 0.1, s * 0.07, s * 0.04, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Cute eyes inside cockpit (looking forward)
  ctx.fillStyle = '#33425a';
  ctx.beginPath();
  ctx.arc(s * 0.26, -s * 0.04, s * 0.04, 0, Math.PI * 2);
  ctx.arc(s * 0.12, -s * 0.04, s * 0.04, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(s * 0.275, -s * 0.055, s * 0.014, 0, Math.PI * 2);
  ctx.arc(s * 0.135, -s * 0.055, s * 0.014, 0, Math.PI * 2);
  ctx.fill();

  // ── Mast ──
  ctx.fillStyle = '#5a6473';
  ctx.fillRect(-s * 0.03, -s * 0.55, s * 0.06, s * 0.2);

  // ── Skids ──
  ctx.strokeStyle = '#4a5260';
  ctx.lineWidth = s * 0.05;
  ctx.lineCap = 'round';
  // struts
  [[-s * 0.18], [s * 0.18]].forEach(([sx]) => {
    ctx.beginPath();
    ctx.moveTo(sx, s * 0.3);
    ctx.lineTo(sx, s * 0.46);
    ctx.stroke();
  });
  // rail
  ctx.beginPath();
  ctx.moveTo(-s * 0.38, s * 0.48);
  ctx.lineTo(s * 0.38, s * 0.48);
  ctx.stroke();

  // ── Tail rotor (spins) ──
  ctx.save();
  ctx.translate(-s * 0.92, 0);
  ctx.rotate(active ? (t / 35) : 0);
  ctx.fillStyle = '#3a4250';
  for (let i = 0; i < 2; i++) {
    ctx.save();
    ctx.rotate(Math.PI * i);
    ctx.beginPath();
    ctx.ellipse(0, s * 0.14, s * 0.035, s * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#5a6473';
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.04, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Main rotor — a spinning DISC seen slightly from above ──
  // Foreshortening (scale Y) keeps the blades sweeping around an ellipse so the
  // rotor reads as continuously spinning instead of flipping to a vertical line.
  ctx.save();
  ctx.translate(0, -s * 0.55);
  ctx.scale(1, 0.34);                       // perspective tilt of the rotor plane
  const spin = active ? (t / 90) : 0.4;     // continuous rotation angle

  // translucent swept disc (motion blur) when active
  if (active) {
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#aeb6c2';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.92, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.rotate(spin);
  // four blades evenly spaced — always on the ellipse, never a bare vertical line
  for (let i = 0; i < 4; i++) {
    ctx.save();
    ctx.rotate((Math.PI / 2) * i);
    const bladeGrad = ctx.createLinearGradient(0, 0, s * 0.9, 0);
    bladeGrad.addColorStop(0, '#4a5260');
    bladeGrad.addColorStop(1, '#2c333f');
    ctx.fillStyle = bladeGrad;
    ctx.beginPath();
    ctx.ellipse(s * 0.46, 0, s * 0.46, s * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    // light glint near each blade tip
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(s * 0.72, -s * 0.02, s * 0.12, s * 0.025, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // bright hub cap on top of the rotor (drawn un-squished)
  ctx.save();
  ctx.translate(0, -s * 0.55);
  const hubGrad = ctx.createRadialGradient(-s * 0.02, -s * 0.02, 0, 0, 0, s * 0.09);
  hubGrad.addColorStop(0, '#ffe9a8');
  hubGrad.addColorStop(1, '#f0a93c');
  ctx.fillStyle = hubGrad;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawCollectStar(ctx, ox, oy, W, wobble) {
  const r = W * 0.045;
  const t = Date.now();
  ctx.save();
  ctx.translate(ox, oy + Math.sin(wobble) * W * 0.012);
  ctx.rotate(Math.sin(wobble * 0.5) * 0.25);

  // soft glow halo
  ctx.save();
  ctx.globalAlpha = 0.35 + Math.sin(t / 200) * 0.15;
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
  glow.addColorStop(0, 'rgba(255,230,120,0.9)');
  glow.addColorStop(1, 'rgba(255,230,120,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // star body with gradient
  const grad = ctx.createLinearGradient(0, -r, 0, r);
  grad.addColorStop(0, '#fff3b0');
  grad.addColorStop(1, '#ffc107');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#ff9800';
  ctx.lineWidth = r * 0.12;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // sparkle highlight
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.16, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStar(ctx, cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    const radius = i % 2 === 0 ? r : r * 0.45;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const canvasRef = useRef(null);
  const audioRef = useRef(null); // { ctx, analyser, buffer }
  const stateRef = useRef({
    heliY: 0.82,          // current y as fraction of screen height
    targetHeliY: 0.82,    // target y
    trillDetected: false,
    rms: 0,
    trillFreq: 0,
    clouds: CLOUDS.map(c => ({ ...c })),
    sparks: [],
    milestone: null,
    milestoneAlpha: 0,
    showTherapist: false,
    lastTime: 0,
    running: false,
    stars: [],
    lastSpawn: 0,
    score: 0,
    wonSignaled: false,
  });
  const rafRef = useRef(null);
  const analyseTimerRef = useRef(null);

  const [phase, setPhase] = useState('start'); // 'start' | 'denied' | 'playing'
  const [showTherapist, setShowTherapist] = useState(false);

  // Keep showTherapist in stateRef
  useEffect(() => {
    stateRef.current.showTherapist = showTherapist;
  }, [showTherapist]);

  // Audio analysis loop (20ms)
  const startAudioAnalysis = useCallback((analyser) => {
    const bufSize = analyser.fftSize;
    const buffer = new Float32Array(bufSize);
    const sampleRate = analyser.context.sampleRate;

    let confirm = 0;
    analyseTimerRef.current = setInterval(() => {
      analyser.getFloatTimeDomainData(buffer);
      const result = detectTrill(buffer, sampleRate);

      // Debounce: only count as "trill" after several consecutive positives,
      // so a brief noise can't bump the helicopter up. Drops instantly on loss.
      if (result.detected) confirm = Math.min(confirm + 1, TRILL_CONFIRM_FRAMES);
      else confirm = 0;

      stateRef.current.trillDetected = confirm >= TRILL_CONFIRM_FRAMES;
      stateRef.current.rms = result.rms;
      stateRef.current.trillFreq = result.freq;
      stateRef.current.modIndex = result.modIndex;
    }, 20);
  }, []);

  // Animation loop
  const animate = useCallback((now) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const s = stateRef.current;

    const dt = s.lastTime ? Math.min(now - s.lastTime, 50) : 16;
    s.lastTime = now;

    // Update clouds
    s.clouds.forEach(c => {
      c.x = (c.x + c.speed * dt) % 1.15;
      if (c.x > 1.1) c.x = -0.15;
    });

    // Update helicopter position
    if (s.trillDetected) {
      s.targetHeliY = Math.max(TOP_BOUND, s.targetHeliY - RISE_SPEED * (dt / 16));
    } else {
      s.targetHeliY = Math.min(BOTTOM_BOUND, s.targetHeliY + FALL_SPEED * (dt / 16));
    }
    s.heliY = lerp(s.heliY, s.targetHeliY, LERP_FACTOR);

    // ── Collectible stars ──
    // Spawn a star: usually high up (child must lift the helicopter to reach it).
    if (!s.wonSignaled && now - s.lastSpawn > STAR_SPAWN_MS) {
      s.lastSpawn = now;
      // 75% of stars sit in the upper half of the sky, 25% a bit lower
      const high = Math.random() < 0.75;
      s.stars.push({
        x: 1.1,
        y: high ? (0.15 + Math.random() * 0.28) : (0.48 + Math.random() * 0.2),
        wobble: Math.random() * Math.PI * 2,
        collected: false,
      });
    }

    const hx = 0.42;                 // helicopter x (fraction)
    const aspect = W / H;
    s.stars.forEach(o => {
      o.x -= STAR_SPEED * dt;
      o.wobble += dt * 0.004;
      if (o.collected) return;
      // Collection test (generous radius — forgiving for little ones)
      const dx = o.x - hx;
      const dy = (o.y - s.heliY) / aspect;
      if (dx * dx + dy * dy < STAR_RADIUS * STAR_RADIUS) {
        o.collected = true;
        s.score += 1;
        s.milestone = STARS_MESSAGES[(s.score - 1) % STARS_MESSAGES.length];
        s.milestoneAlpha = 1.0;
        // celebratory burst at the star
        for (let i = 0; i < 22; i++) {
          s.sparks.push({
            x: o.x * W + (Math.random() - 0.5) * W * 0.12,
            y: o.y * H + (Math.random() - 0.5) * W * 0.12,
            r: 6 + Math.random() * 14,
            alpha: 1,
            decay: 0.012 + Math.random() * 0.015,
          });
        }
        // Win!
        if (s.score >= STARS_TO_WIN && !s.wonSignaled) {
          s.wonSignaled = true;
          setPhase('won');
        }
      }
    });
    // Remove collected or off-screen stars
    s.stars = s.stars.filter(o => !o.collected && o.x > -0.12);

    // Update sparkles
    s.sparks = s.sparks
      .map(sp => ({ ...sp, alpha: sp.alpha - sp.decay, y: sp.y - 0.4 }))
      .filter(sp => sp.alpha > 0);

    // Fade milestone text
    if (s.milestoneAlpha > 0) {
      s.milestoneAlpha = Math.max(0, s.milestoneAlpha - 0.008);
    }

    drawScene(ctx, W, H, s);

    // live telemetry for the therapist view
    window.__telemetry = {
      game: '🚁 Вертоліт',
      primaryLabel: 'Зірочки',
      primary: s.score + ' / ' + STARS_TO_WIN,
      detect: s.trillDetected,
      level: s.rms,
      extra: s.trillDetected ? (s.trillFreq.toFixed(0) + ' Гц') : '',
    };

    rafRef.current = requestAnimationFrame(animate);
  }, []);

  const startGame = useCallback(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      // Large window (~186ms @44.1kHz) so 25–35 Hz envelope modulation
      // spans several cycles — essential for reliable trill autocorrelation.
      analyser.fftSize = 8192;
      analyser.smoothingTimeConstant = 0.1;
      source.connect(analyser);
      audioRef.current = { ctx: audioCtx, analyser, stream };

      startAudioAnalysis(analyser);
      stateRef.current.running = true;
      setPhase('playing');

      rafRef.current = requestAnimationFrame(animate);
    } catch (e) {
      console.error(e);
      setPhase('denied');
    }
  }, [animate, startAudioAnalysis]);

  // Reset for another round (mic already granted, loop already running)
  const restartGame = useCallback(() => {
    const s = stateRef.current;
    s.heliY = 0.82;
    s.targetHeliY = 0.82;
    s.stars = [];
    s.sparks = [];
    s.score = 0;
    s.wonSignaled = false;
    s.lastSpawn = 0;
    s.milestone = null;
    s.milestoneAlpha = 0;
    setPhase('playing');
  }, []);

  // Resize canvas
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
  }, []);

  // Cleanup
  useEffect(() => {
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (analyseTimerRef.current) clearInterval(analyseTimerRef.current);
      if (audioRef.current) {
        audioRef.current.stream.getTracks().forEach(t => t.stop());
        audioRef.current.ctx.close();
      }
    };
  }, []);

  return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      <canvas ref={canvasRef} style={{ position: 'absolute', inset: 0 }} />
      <HomeButton />

      {phase === 'start' && (
        <StartScreen onStart={startGame} />
      )}

      {phase === 'denied' && (
        <PermissionDenied onRetry={startGame} />
      )}

      {phase === 'playing' && (
        <TherapistToggle
          active={showTherapist}
          onToggle={() => setShowTherapist(v => !v)}
        />
      )}

      {phase === 'won' && (
        <WinScreen onRestart={restartGame} />
      )}
    </div>
  );
}
