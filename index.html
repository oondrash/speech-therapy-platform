<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Логоігри — мовні ігри для дітей</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive;
      background: linear-gradient(160deg, #6DC8F3 0%, #A78BFA 100%);
      color: #fff; min-height: 100vh; overflow-x: hidden;
      -webkit-user-select: none; user-select: none;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 48px; }
    .logo { text-align: center; margin-bottom: 6px; }
    .logo .title {
      font-size: clamp(30px, 8vw, 64px); font-weight: 800;
      text-shadow: 2px 4px 0 rgba(80,50,140,0.4);
    }
    .logo .sub { font-size: clamp(14px, 3.6vw, 24px); opacity: 0.92; margin-top: 2px; }

    .banner {
      background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.4);
      border-radius: 18px; padding: 14px 18px; margin: 18px auto 8px; max-width: 620px;
      text-align: center; font-size: clamp(14px, 3.4vw, 19px);
    }

    .section-title {
      text-align: center; font-size: clamp(18px, 4.4vw, 28px); font-weight: 800;
      margin: 28px 0 16px; text-shadow: 1px 2px 0 rgba(80,50,140,0.3);
    }

    .games { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 620px) { .games { grid-template-columns: 1fr 1fr; } }

    .game-card {
      background: rgba(255,255,255,0.95); color: #333; border-radius: 24px;
      padding: 22px; text-align: center; cursor: pointer; text-decoration: none;
      box-shadow: 0 10px 26px rgba(60,40,110,0.3); transition: transform .12s, box-shadow .12s;
      display: block;
    }
    .game-card:active { transform: scale(0.97); }
    @media (hover: hover) { .game-card:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(60,40,110,0.4); } }
    .game-card .emoji { font-size: clamp(64px, 16vw, 104px); line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15)); }
    .game-card .name { font-size: clamp(20px, 5vw, 30px); font-weight: 800; color: #5a3a9a; margin-top: 10px; }
    .game-card .desc { font-size: clamp(13px, 3.2vw, 18px); color: #666; margin-top: 6px; line-height: 1.35; }
    .game-card .sound {
      display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 20px;
      background: #FFE3A3; color: #9a6a00; font-weight: 800; font-size: clamp(13px,3vw,18px);
    }

    .roles { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 460px; margin: 0 auto; }
    .role {
      background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.35);
      border-radius: 18px; padding: 16px 20px; text-align: center; cursor: pointer;
      color: #fff; text-decoration: none; font-size: clamp(15px,3.6vw,20px); font-weight: 700;
      transition: background .15s;
    }
    .role:active { transform: scale(0.97); }
    .role .em { font-size: 32px; display: block; margin-bottom: 4px; }
    .role small { display: block; font-weight: 400; opacity: 0.85; font-size: 13px; margin-top: 4px; }

    .therapist-link {
      text-align: center; margin-top: 30px;
    }
    .therapist-link a {
      color: rgba(255,255,255,0.92); font-size: 14px; text-decoration: underline;
    }
    .codechip {
      display: inline-block; background: rgba(40,170,90,0.9); color: #fff;
      padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="title">🎈 Логоігри</div>
    <div class="sub">Весело вчимося говорити правильно</div>
  </div>

  <div id="content"></div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var code = (params.get('code') || '').trim().toUpperCase();
  var content = document.getElementById('content');

  // Extensionless paths avoid the .html→clean-URL redirect that would drop
  // the ?code query string (breaks live monitoring) on some static hosts.
  var GAMES = [
    {
      file: 'games/helicopter', emoji: '🚁', name: 'Вертоліт',
      desc: 'Вертоліт злітає, коли ти гарчиш «Р-р-р»',
      sound: 'Звук «Р»'
    },
    {
      file: 'games/drummer', emoji: '🐱', name: 'Котик-танцюрист',
      desc: 'Котик танцює, коли ти кажеш «Да-да-да»',
      sound: 'Склади «Да»'
    },
    {
      file: 'games/bumblebee', emoji: '🐝', name: 'Джміль',
      desc: 'Джміль летить до квітки, коли ти дзижчиш «Ж-ж-ж»',
      sound: 'Звук «Ж»'
    },
    {
      file: 'games/mosquito', emoji: '🦟', name: 'Комарик',
      desc: 'Комарик летить до носика, коли ти дзижчиш «Зз-зз»',
      sound: 'Звук «З»'
    }
  ];

  function gameHref(file) {
    return file + (code ? ('?code=' + encodeURIComponent(code)) : '');
  }

  function gamesGridHtml() {
    return '<div class="games">' + GAMES.map(function (g) {
      return '<a class="game-card" href="' + gameHref(g.file) + '">' +
        '<div class="emoji">' + g.emoji + '</div>' +
        '<div class="name">' + g.name + '</div>' +
        '<div class="desc">' + g.desc + '</div>' +
        '<div class="sound">' + g.sound + '</div>' +
      '</a>';
    }).join('') + '</div>';
  }

  if (code) {
    // Child arrived from a therapist's link — go straight to game choice.
    content.innerHTML =
      '<div class="banner">👩‍⚕️ Логопед спостерігатиме за грою<br>' +
      '<span class="codechip">Сесія: ' + code + '</span></div>' +
      '<div class="section-title">Обери гру 👇</div>' +
      gamesGridHtml();
  } else {
    // Landing — choose role.
    content.innerHTML =
      '<div class="section-title">Обери гру 👇</div>' +
      gamesGridHtml() +
      '<div class="therapist-link">' +
        '<a href="watch">🩺 Я логопед — відкрити кабінет спостереження</a>' +
      '</div>';
  }
</script>
</body>
</html>
